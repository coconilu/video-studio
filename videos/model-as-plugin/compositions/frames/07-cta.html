  <div id="root" data-composition-id="07-cta" data-width="1920" data-height="1080">

    <div class="clip" id="07-cta-headline" data-start="0" data-duration="9.84" data-track-index="1">亲手做到？</div>

    <div class="clip" id="07-cta-chip" data-start="1.6" data-duration="0.9" data-track-index="2"><span>$</span></div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["07-cta"] = tl;

    // Frame length 9.84s (Elias voice). Phrase windows: 想亲手做到 0–1.70 ·
    // 实战课程第三课带你接入 1.70–5.09 · 第九课带你造一个 5.09–7.63 · 评论区见 7.63–9.04.
    const DURATION = 9.84;
    const byId = (id) => document.getElementById(id);
    const headlineEl = byId("07-cta-headline");
    const chipEl = byId("07-cta-chip");
    const pillEl = byId("07-cta-pill");
    const termEl = byId("07-cta-term");
    const textEl = byId("07-cta-text");
    const cursorEl = byId("07-cta-cursor");
    const cardL3El = byId("07-cta-card-l3");
    const cardL9El = byId("07-cta-card-l9");
    const monoEl = byId("07-cta-mono");

    // Static centering offsets live outside the tween channels so no GSAP/CSS
    // transform conflict can drop them.
    gsap.set([headlineEl, chipEl, pillEl, monoEl], { xPercent: -50 });
    gsap.set([chipEl, pillEl], { yPercent: -50 });

    // Scene 1 (0–1.6s, 「想亲手做到」) — the opening headline settles, then
    // demotes: shrinks, lifts, and fades to a faint gray that stays as backdrop.
    tl.fromTo(
      headlineEl,
      { opacity: 0, y: 28 },
      { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
      0,
    );
    tl.to(
      headlineEl,
      { scale: 0.42, y: -250, opacity: 0.45, duration: 0.6, ease: "power2.inOut" },
      1.0,
    );

    // Scene 2 (1.6–3.5s) — the $ chip spring-pops in, holds a beat, then the wide
    // terminal pill stretches horizontally out of its silhouette (chip fades over
    // the pill's scaleX 0.1833 sliver = same 176×112 rounded shape, same center).
    tl.fromTo(
      chipEl,
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.6,
    );
    tl.to(chipEl, { opacity: 0, duration: 0.22, ease: "power1.in" }, 2.05);
    tl.fromTo(
      pillEl,
      { scaleX: 0.1833, opacity: 1 },
      { scaleX: 1, opacity: 1, duration: 0.55, ease: "power2.inOut" },
      2.05,
    );
    // Terminal content fades in over the last ~40% of the stretch.
    tl.fromTo(termEl, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out" }, 2.38);

    // The command types character-by-character — discrete states reverse-searched
    // every frame (seek-safe in both directions). Typing completes at 3.44s.
    const SEQUENCE = [
      { t: 0, text: "" },
      { t: 2.5, text: "p" },
      { t: 2.58, text: "pn" },
      { t: 2.66, text: "pnp" },
      { t: 2.74, text: "pnpm" },
      { t: 2.86, text: "pnpm " },
      { t: 2.96, text: "pnpm d" },
      { t: 3.04, text: "pnpm ds" },
      { t: 3.12, text: "pnpm dsh" },
      { t: 3.2, text: "pnpm dsh " },
      { t: 3.3, text: "pnpm dsh w" },
      { t: 3.37, text: "pnpm dsh we" },
      { t: 3.44, text: "pnpm dsh web" },
    ];
    const CHANGE_TIMES = SEQUENCE.filter((e, i) => i > 0 && e.text !== SEQUENCE[i - 1].text).map(
      (e) => e.t,
    );
    function textAt(time) {
      for (let i = SEQUENCE.length - 1; i >= 0; i--) {
        if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
      }
      return "";
    }
    const driver = { t: 0 };
    tl.to(
      driver,
      {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: () => {
          textEl.textContent = textAt(driver.t);
        },
      },
      0,
    );

    // Caret — solid while keystrokes land (baked change times, no mutable state),
    // deterministic square-wave blink when idle; whole cycles over [2.45, 9.84].
    const blink = { p: 0 };
    tl.to(
      blink,
      {
        p: Math.PI * 2 * 9,
        duration: 7.39,
        ease: "none",
        onUpdate: () => {
          const typing = CHANGE_TIMES.some((ct) => ct <= driver.t && driver.t - ct < 0.18);
          cursorEl.style.opacity = typing || Math.sin(blink.p) > 0 ? "1" : "0";
        },
      },
      2.45,
    );

    // Scene 3 — the two lesson cards land on their phrase cues (「第三课」 from
    // 2.5s, 「第九课」 from 5.3s), then the mono footer fades up.
    tl.fromTo(
      cardL3El,
      { scale: 0, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      2.5,
    );
    tl.fromTo(
      cardL9El,
      { scale: 0, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      5.3,
    );
    tl.fromTo(
      monoEl,
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      6.0,
    );

    // Scene 4 (6.5–9.84s) — full hold through 「评论区见」 and the tail; only the
    // caret blink above keeps time.
  </script>
